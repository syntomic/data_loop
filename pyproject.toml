[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-loop"
version = "0.1.0"
description = "LLM 训练数据闭环平台 (offline + online + loop infra), mini profile"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=14",
    "numpy>=1.24",
    "PyYAML>=6",
    "warcio>=1.7",
    # mini profile 核心后端: Daft 单机计算 + Lance 存储 + trafilatura/resiliparse 抽取
    "daft>=0.7",
    "daft-lance>=0.1",
    "pylance>=7",
    "trafilatura>=1.8",
    "resiliparse>=0.14",
    # M7 统一用 Flink (本地 MiniCluster)
    "apache-flink>=1.20",
    "cffi",
]

[project.optional-dependencies]
# cluster profile 额外依赖 (Ray 分布式 / Paimon / Postgres / 模型客户端 / 对象存储),
# 不随 mini 默认安装: uv sync --extra cluster (GPU 节点上再装 vllm/fasttext)
cluster = [
    "ray",                  # Daft Ray runner
    "psycopg[binary]",      # Postgres registry
    "openai",               # vLLM / 强模型 / 裁判 (OpenAI 兼容客户端)
    "fsspec",               # 对象存储 (corpus shard 文本)
    "s3fs",
]

[dependency-groups]
dev = ["pytest>=7"]

[project.scripts]
dataloop-registry = "registry.cli:main"
dataloop-mini = "scripts.run_mini:main"

[tool.setuptools.packages.find]
include = ["common*", "schemas*", "offline*", "ablation*", "online*", "registry*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
