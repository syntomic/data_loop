name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --frozen --dev --python ${{ matrix.python-version }}
      - name: Unit + e2e tests
        run: uv run pytest -q

  flink-parity:
    # M7 PyFlink 后端与 replay 后端输出一致性 (依赖较重, 单独 job)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Sync with flink extra
        run: uv sync --frozen --dev --extra flink --python 3.11
      - name: Parity test
        run: uv run pytest -q tests/test_m7_flink.py

  mini-pipeline:
    # README §7 验收: mini profile 全链 9 模块端到端跑通
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --frozen --python 3.11
      - name: Run mini pipeline (M1–M9)
        run: uv run python scripts/run_mini.py | tee mini-run.log
      - name: Verify registry
        run: |
          uv run python -m registry.cli versions
          uv run python -m registry.cli ablations
      - name: Upload artifacts (manifest + 偏好集 + registry)
        uses: actions/upload-artifact@v4
        with:
          name: mini-run-${{ github.sha }}
          path: |
            mini-run.log
            data/corpus/manifest.json
            data/preference_pair/
            data/rlhf_example/
            data/registry.sqlite
          retention-days: 14
