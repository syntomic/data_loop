name: Release

# 平台产出物是数据集而非服务: 打 tag 即跑 mini 全链并把
# corpus manifest / 偏好数据集 / registry 附到 GitHub Release。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-datasets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Sync (locked)
        run: uv sync --frozen --dev --python 3.11
      - name: Tests
        run: uv run pytest -q
      - name: Run mini pipeline
        run: uv run python scripts/run_mini.py | tee mini-run.log
      - name: Bundle datasets
        run: |
          tar czf corpus-${{ github.ref_name }}.tar.gz data/corpus
          tar czf pref-${{ github.ref_name }}.tar.gz data/preference_pair data/rlhf_example data/human_queue
          cp data/registry.sqlite registry-${{ github.ref_name }}.sqlite
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            corpus-${{ github.ref_name }}.tar.gz
            pref-${{ github.ref_name }}.tar.gz
            registry-${{ github.ref_name }}.sqlite
            mini-run.log
          generate_release_notes: true
